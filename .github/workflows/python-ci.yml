name: Quality gates

on:
  pull_request:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      - name: Run full Python test suite
        run: uv run pytest -q

      - name: Run Issue #6 fixture benchmark
        run: uv run pytest tests/acceptance/test_cli_fixture_gate.py -q

      - name: Recompute fixture replay digest and gate decision
        run: uv run pytest tests/acceptance/test_cli_fixture_gate.py -q -k test_replay_recomputes_the_same_logical_digest_and_gate_decision

      - name: Replay the published stored-live artifacts and compare logical digests
        run: uv run pytest tests/acceptance/test_cli_fixture_gate.py -q -k test_replay_reproduces_published_live_artifact_digests

  fixture-container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build clean fixture-only container
        run: docker build --tag braincrew-evaluation-fixture:ci .

      - name: Run Python gates and fixture benchmark without a host mount
        run: docker run --rm --network none braincrew-evaluation-fixture:ci

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history for scanning
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan tracked history for secrets and credential-like material
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install repository-pinned npm
        run: npm install --global npm@11.12.1

      - name: Report npm version
        run: npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Build static dashboard
        run: npm run build

      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e
