name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.19.0
          cache: npm

      - name: Install locked dependencies
        run: npx --yes npm@11.12.1 ci

      - name: Build static dashboard
        run: npx --yes npm@11.12.1 run build

      - name: Test static dashboard build output
        run: npx --yes npm@11.12.1 run test:build-output

      - name: Browser smoke test
        run: npx --yes npm@11.12.1 run test:e2e

      - name: Upload static dashboard artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static dashboard to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify the deployed public dashboard
        env:
          PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: bash scripts/verify-deployed-pages.sh "$PAGES_URL"
